<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ciclo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --ink: #2B1B1F;
    --ink-soft: #6B5359;
    --paper: #FAF6F3;
    --card: #FFFFFF;
    --line: #E8DAD8;
    --wine: #7A2E38;
    --wine-deep: #571F27;
    --leve: #F2C6D1;
    --leve-ink: #7A3A48;
    --medio: #D6607A;
    --medio-ink: #ffffff;
    --abundante: #7A1F30;
    --abundante-ink: #ffffff;
    --gold: #B98A4E;
    --ok-bg: #F1EDE3;
    --warn-bg: #F6E4C9;
    --warn-ink: #7A5A1E;
    --shadow: 0 1px 2px rgba(43,27,31,0.06);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #F3E9E9;
      --ink-soft: #C9B3B6;
      --paper: #1E1417;
      --card: #2A1C20;
      --line: #432E33;
      --wine: #E39AA9;
      --wine-deep: #F2C6D1;
      --leve: #4A2C33;
      --leve-ink: #F2C6D1;
      --medio: #8C3E52;
      --medio-ink: #FBEAEE;
      --abundante: #C24A5F;
      --abundante-ink: #2B1B1F;
      --gold: #D8AE73;
      --ok-bg: #2B2226;
      --warn-bg: #3B2E1B;
      --warn-ink: #E9C685;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --ink: #F3E9E9;
    --ink-soft: #C9B3B6;
    --paper: #1E1417;
    --card: #2A1C20;
    --line: #432E33;
    --wine: #E39AA9;
    --wine-deep: #F2C6D1;
    --leve: #4A2C33;
    --leve-ink: #F2C6D1;
    --medio: #8C3E52;
    --medio-ink: #FBEAEE;
    --abundante: #C24A5F;
    --abundante-ink: #2B1B1F;
    --gold: #D8AE73;
    --ok-bg: #2B2226;
    --warn-bg: #3B2E1B;
    --warn-ink: #E9C685;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 8px;
  }
  header.top {
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .moon { font-size: 1.3rem; }

  .banner {
    background: var(--ok-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .banner.warn {
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-color: transparent;
  }
  .banner strong { font-family: 'Fraunces', serif; font-weight: 600; }

  section.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  section.card h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--wine);
  }

  .cal-head {
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-head button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    width: 34px; height: 34px;
    font-size: 1rem;
    color: var(--wine);
    cursor: pointer;
  }
  .cal-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.02rem;
    text-transform: capitalize;
  }
  .grid7 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .dow {
    text-align:center;
    font-size: 0.68rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-bottom: 4px;
  }
  .day {
    aspect-ratio: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 50%;
    font-size: 0.85rem;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    position: relative;
    border: 1px solid transparent;
    user-select: none;
  }
  .day.empty { cursor: default; }
  .day.today { border-color: var(--wine); }
  .day.leve { background: var(--leve); color: var(--leve-ink); }
  .day.medio { background: var(--medio); color: var(--medio-ink); }
  .day.abundante { background: var(--abundante); color: var(--abundante-ink); }
  .day.predicted {
    box-shadow: inset 0 0 0 1.5px var(--gold);
    color: var(--ink);
  }

  .legend {
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .legend span { display:flex; align-items:center; gap:6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; display:inline-block; }
  .dot.leve { background: var(--leve); }
  .dot.medio { background: var(--medio); }
  .dot.abundante { background: var(--abundante); }
  .dot.predicted { box-shadow: inset 0 0 0 1.5px var(--gold); background: transparent; }

  .stat-row {
    display:flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--ink-soft); }
  .stat-row .value { font-weight: 600; }

  label.field {
    display:block;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 5px;
    margin-top: 14px;
  }
  label.field:first-of-type { margin-top: 0; }
  select, input[type="date"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    font-size: 0.92rem;
  }

  .toggle-row {
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .switch {
    position: relative;
    width: 44px;
    height: 25px;
    flex-shrink: 0;
  }
  .switch input { opacity:0; width:0; height:0; }
  .slider-tog {
    position:absolute; cursor:pointer; inset:0;
    background: var(--line);
    border-radius: 20px;
    transition: 0.2s;
  }
  .slider-tog:before {
    content:"";
    position:absolute;
    height: 19px; width: 19px;
    left: 3px; bottom: 3px;
    background: var(--card);
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider-tog { background: var(--wine); }
  .switch input:checked + .slider-tog:before { transform: translateX(19px); }

  .btn {
    display:block;
    width: 100%;
    text-align:center;
    padding: 11px;
    border-radius: 9px;
    border: none;
    background: var(--wine);
    color: #fff;
    font-family: 'Karla', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn:active { background: var(--wine-deep); }
  .btn.ghost {
    background: transparent;
    color: var(--wine);
    border: 1px solid var(--wine);
  }

  .contra-body { margin-top: 14px; }
  .hidden { display: none; }

  .foot-note {
    font-size: 0.74rem;
    color: var(--ink-soft);
    text-align:center;
    margin-top: 18px;
    line-height: 1.5;
    padding: 0 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Mi ciclo</h1>
    <span class="moon">🌙</span>
  </header>

  <div id="connBanner" class="banner hidden"></div>
  <div id="periodBanner" class="banner"></div>

  <section class="card">
    <div class="cal-head">
      <button id="prevMonth" aria-label="Mes anterior">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
    <div class="grid7" id="dowRow"></div>
    <div class="grid7" id="calGrid"></div>
    <div class="legend">
      <span><i class="dot leve"></i>Leve</span>
      <span><i class="dot medio"></i>Medio</span>
      <span><i class="dot abundante"></i>Abundante</span>
      <span><i class="dot predicted"></i>Estimado</span>
    </div>
  </section>

  <section class="card">
    <h2>Resumen</h2>
    <div class="stat-row"><span class="label">Último período</span><span class="value" id="lastPeriod">—</span></div>
    <div class="stat-row"><span class="label">Duración promedio de sangrado</span><span class="value" id="avgDuration">—</span></div>
    <div class="stat-row"><span class="label">Ciclo promedio</span><span class="value" id="avgCycle">—</span></div>
    <div class="stat-row"><span class="label">Próximo período estimado</span><span class="value" id="nextPeriod">—</span></div>
  </section>

  <section class="card">
    <h2>Anticonceptivos</h2>
    <div class="toggle-row">
      <span>Estoy tomando anticonceptivos</span>
      <label class="switch">
        <input type="checkbox" id="contraEnabled">
        <span class="slider-tog"></span>
      </label>
    </div>
    <div id="contraBody" class="contra-body hidden">
      <label class="field">Frecuencia</label>
      <select id="contraFreq">
        <option value="diario">Diaria</option>
        <option value="semanal">Semanal</option>
        <option value="mensual">Mensual</option>
        <option value="trimestral">Trimestral</option>
      </select>
      <label class="field">Fecha de la última toma</label>
      <input type="date" id="contraLast">
      <div id="contraBanner" class="banner" style="margin-top:14px;"></div>
      <button class="btn" id="markTaken">Marcar como tomado hoy</button>
    </div>
  </section>

  <p class="foot-note">Los datos se guardan en la nube (Firebase) y se comparten entre quienes tengan este link.</p>

</div>

<script>
(function(){
  // ======= CONFIGURACIÓN DE FIREBASE =======
  // Pegá acá los datos de tu proyecto (Firebase console → Configuración del proyecto → tus apps → SDK setup).
  const firebaseConfig = {
    apiKey: "AIzaSyDYEuO2LIas3qN0BrW91UVJaoxpRK3wVfQ",
    authDomain: "app-ciclo-menstrual.firebaseapp.com",
    projectId: "app-ciclo-menstrual",
    storageBucket: "app-ciclo-menstrual.firebasestorage.app",
    messagingSenderId: "548314097154",
    appId: "1:548314097154:web:0fad16cdd3b08cc5f5a91b"
  };
  // ==========================================

  const DOW = ['D','L','M','M','J','V','S'];
  const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const STATES = ['leve','medio','abundante'];
  const DEFAULT_STATE = { days: {}, contra: { enabled:false, freq:'diario', last:null } };

  let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  let docRef = null;
  let ready = false;

  function showConn(msg, isWarn){
    const b = document.getElementById('connBanner');
    b.classList.remove('hidden');
    b.className = 'banner' + (isWarn ? ' warn' : '');
    b.innerHTML = msg;
  }
  function hideConn(){
    document.getElementById('connBanner').classList.add('hidden');
  }

  function initFirebase(){
    if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'PEGAR_AQUI'){
      showConn('<strong>Falta configurar Firebase.</strong> Pegá los datos de tu proyecto en firebaseConfig, dentro del archivo.', true);
      renderAll();
      return;
    }
    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      docRef = db.collection('ciclo').doc('compartido');

      docRef.onSnapshot((snap)=>{
        if (snap.exists){
          state = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), snap.data());
        } else {
          docRef.set(state);
        }
        ready = true;
        hideConn();
        renderAll();
      }, (err)=>{
        showConn('No se pudo conectar. Revisá tu conexión a internet.', true);
      });
    } catch(e){
      showConn('Error al conectar con Firebase. Revisá la configuración.', true);
      renderAll();
    }
  }

  function saveState(){
    if (!docRef) return;
    docRef.set(state).catch(()=>{
      showConn('No se pudo guardar el último cambio. Revisá tu conexión.', true);
    });
  }

  let viewYear, viewMonth;
  const today = new Date();
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();

  function fmt(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function parseISO(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function addMonths(d, n){ const r = new Date(d); r.setMonth(r.getMonth()+n); return r; }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function longDate(d){ return d.toLocaleDateString('es-PY', {day:'numeric', month:'long'}); }

  // ---- Cycle math ----
  function getPeriodGroups(days){
    const dates = Object.keys(days).sort();
    const groups = [];
    let cur = null;
    for (const ds of dates){
      const d = parseISO(ds);
      if (cur && daysBetween(parseISO(cur.dates[cur.dates.length-1]), d) <= 1){
        cur.dates.push(ds);
      } else {
        cur = { dates: [ds] };
        groups.push(cur);
      }
    }
    return groups;
  }

  function computeStats(){
    const days = state.days;
    const groups = getPeriodGroups(days);
    if (groups.length === 0){
      return { lastStart:null, avgDuration:null, avgCycle:null, nextStart:null };
    }
    const lastGroup = groups[groups.length-1];
    const lastStart = parseISO(lastGroup.dates[0]);
    const avgDuration = Math.round(groups.reduce((s,g)=>s+g.dates.length,0)/groups.length);

    let avgCycle = null;
    if (groups.length >= 2){
      const recent = groups.slice(-6);
      let total = 0, n=0;
      for (let i=1;i<recent.length;i++){
        total += daysBetween(parseISO(recent[i-1].dates[0]), parseISO(recent[i].dates[0]));
        n++;
      }
      avgCycle = Math.round(total/n);
    }
    const cycleLenForPredict = avgCycle || 28;
    const nextStart = addDays(lastStart, cycleLenForPredict);
    return { lastStart, avgDuration, avgCycle, nextStart };
  }

  // ---- Rendering calendar ----
  function renderDow(){
    const row = document.getElementById('dowRow');
    row.innerHTML = DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  }

  function renderCalendar(){
    const grid = document.getElementById('calGrid');
    document.getElementById('calTitle').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    const first = new Date(viewYear, viewMonth, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const days = state.days;
    const stats = computeStats();
    const todayStr = fmt(today);

    let html = '';
    for (let i=0;i<startWeekday;i++) html += `<div class="day empty"></div>`;
    for (let d=1; d<=daysInMonth; d++){
      const dateObj = new Date(viewYear, viewMonth, d);
      const ds = fmt(dateObj);
      const dayState = days[ds];
      let cls = 'day';
      if (dayState) cls += ' ' + dayState;
      if (ds === todayStr) cls += ' today';
      if (!dayState && stats.nextStart && ds === fmt(stats.nextStart)) cls += ' predicted';
      html += `<div class="${cls}" data-date="${ds}">${d}</div>`;
    }
    grid.innerHTML = html;
    grid.querySelectorAll('.day:not(.empty)').forEach(el=>{
      el.addEventListener('click', ()=> cycleDay(el.dataset.date));
    });
  }

  function cycleDay(ds){
    const days = state.days;
    const current = days[ds];
    const idx = STATES.indexOf(current);
    if (idx === -1) days[ds] = STATES[0];
    else if (idx === STATES.length - 1) delete days[ds];
    else days[ds] = STATES[idx+1];
    state.days = days; saveState();
    renderAll();
  }

  function renderSummary(){
    const s = computeStats();
    document.getElementById('lastPeriod').textContent = s.lastStart ? longDate(s.lastStart) : 'Sin datos aún';
    document.getElementById('avgDuration').textContent = s.avgDuration ? `${s.avgDuration} día${s.avgDuration===1?'':'s'}` : '—';
    document.getElementById('avgCycle').textContent = s.avgCycle ? `${s.avgCycle} días` : 'Necesita 2+ ciclos';
    document.getElementById('nextPeriod').textContent = s.nextStart ? longDate(s.nextStart) : '—';

    const banner = document.getElementById('periodBanner');
    if (!s.lastStart){
      banner.className = 'banner';
      banner.innerHTML = `Empezá marcando los días de sangrado en el calendario de abajo.`;
    } else {
      const diff = daysBetween(today, s.nextStart);
      if (diff < 0){
        banner.className = 'banner warn';
        banner.innerHTML = `<strong>El período estimado ya pasó hace ${Math.abs(diff)} día${Math.abs(diff)===1?'':'s'}.</strong> Marcá el calendario cuando empiece.`;
      } else if (diff <= 3){
        banner.className = 'banner warn';
        banner.innerHTML = diff===0 ? `<strong>Hoy es el día estimado</strong> de inicio del próximo período.` : `<strong>Faltan ${diff} día${diff===1?'':'s'}</strong> para el próximo período estimado.`;
      } else {
        banner.className = 'banner';
        banner.innerHTML = `Próximo período estimado en ${diff} días, alrededor del <strong>${longDate(s.nextStart)}</strong>.`;
      }
    }
  }

  // ---- Contraceptives ----
  function nextContraDue(contra){
    if (!contra.last) return null;
    const last = parseISO(contra.last);
    switch(contra.freq){
      case 'diario': return addDays(last, 1);
      case 'semanal': return addDays(last, 7);
      case 'mensual': return addMonths(last, 1);
      case 'trimestral': return addMonths(last, 3);
      default: return null;
    }
  }

  function renderContra(){
    const contra = state.contra;
    document.getElementById('contraEnabled').checked = contra.enabled;
    document.getElementById('contraFreq').value = contra.freq || 'diario';
    document.getElementById('contraLast').value = contra.last || '';
    document.getElementById('contraBody').classList.toggle('hidden', !contra.enabled);

    if (!contra.enabled) return;
    const banner = document.getElementById('contraBanner');
    const due = nextContraDue(contra);
    if (!due){
      banner.className = 'banner';
      banner.innerHTML = `Registrá la fecha de la última toma para calcular el recordatorio.`;
      return;
    }
    const diff = daysBetween(new Date(today.getFullYear(),today.getMonth(),today.getDate()), new Date(due.getFullYear(),due.getMonth(),due.getDate()));
    if (diff <= 0){
      banner.className = 'banner warn';
      banner.innerHTML = diff===0 ? `<strong>Hoy toca tomar</strong> tu anticonceptivo.` : `<strong>Atrasado por ${Math.abs(diff)} día${Math.abs(diff)===1?'':'s'}.</strong>`;
    } else if (diff === 1){
      banner.className = 'banner warn';
      banner.innerHTML = `<strong>Mañana toca</strong> la próxima toma.`;
    } else {
      banner.className = 'banner';
      banner.innerHTML = `Próxima toma: <strong>${longDate(due)}</strong> (en ${diff} días).`;
    }
  }

  document.getElementById('contraEnabled').addEventListener('change', (e)=>{
    const contra = state.contra;
    contra.enabled = e.target.checked;
    state.contra = contra; saveState();
    renderContra();
  });
  document.getElementById('contraFreq').addEventListener('change', (e)=>{
    const contra = state.contra;
    contra.freq = e.target.value;
    state.contra = contra; saveState();
    renderContra();
  });
  document.getElementById('contraLast').addEventListener('change', (e)=>{
    const contra = state.contra;
    contra.last = e.target.value || null;
    state.contra = contra; saveState();
    renderContra();
  });
  document.getElementById('markTaken').addEventListener('click', ()=>{
    const contra = state.contra;
    contra.last = fmt(today);
    state.contra = contra; saveState();
    renderContra();
  });

  // ---- Month navigation ----
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewMonth--; if (viewMonth<0){ viewMonth=11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewMonth++; if (viewMonth>11){ viewMonth=0; viewYear++; }
    renderCalendar();
  });

  function renderAll(){
    renderDow();
    renderCalendar();
    renderSummary();
    renderContra();
  }

  initFirebase();
</script>
</body>
</html>
